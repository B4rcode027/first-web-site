<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
<!--comi o cu de qem ta lendo-->
    <style>
      @import url("https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700,800,900&display=swap");
      @import url("https://use.fontawesome.com/releases/v6.5.1/css/all.css");

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #25252b;
      }

      * {
        font-family: "Poppins", sans-serif;
      }

      @property --a {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }

      .box {
        position: relative;
        width: 400px;
        height: 200px;
        background: repeating-conic-gradient(
          from var(--a),
          #D3AF37 0%,
          #D3AF37 5%,
          transparent 5%,
          transparent 40%,
          #D3AF37 50%
        );
        filter: drop-shadow(0 15px 50px #000);
        border-radius: 20px;
        animation: rotating 4s linear infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }

      @keyframes rotating {
        0% {
          --a: 0deg;
        }
        100% {
          --a: 360deg;
        }
      }

      .box::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: repeating-conic-gradient(
          from var(--a),
          #fff 0%,
          #fff 5%,
          transparent 5%,
          transparent 40%,
          #fff 50%
        );
        filter: drop-shadow(0 15px 50px #000);
        border-radius: 20px;
        animation: rotating 4s linear infinite;
        animation-delay: -1s;
      }

      .box::after {
        content: "";
        position: absolute;
        inset: 4px;
        background: #2d2d39;
        border-radius: 15px;
        border: 8px solid #25252b;
      }

      .box:hover {
        width: 450px;
        height: 500px;
      }

      .box:hover .login {
        inset: 40px;
      }

      .box:hover .loginBx {
        transform: translateY(0px);
      }

      .login {
        position: absolute;
        inset: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        border-radius: 10px;
        background: #00000033;
        color: #fff;
        z-index: 1000;
        box-shadow: inset 0 10px 20px #00000080;
        border-bottom: 2px solid #ffffff80;
        transition: 0.5s;
        overflow: hidden;
      }

      .loginBx {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 20px;
        width: 70%;
        transform: translateY(126px);
        transition: 0.5s;
      }

      h2 {
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.2em;
      }

      h2 i {
        color: #D3AF37;
        text-shadow:
          0 0 5px #D3AF37,
          0 0 20px #D3AF37;
      }

      input {
        width: 100%;
        padding: 10px 20px;
        outline: none;
        border: none;
        font-size: 1em;
        color: #fff;
        background: #0000001a;
        border: 2px solid #fff;
        border-radius: 30px;
      }

      input::placeholder {
        color: #999;
      }

      input[type="submit"] {
        background: #D3AF37;
        border: none;
        font-weight: 500;
        color: #111;
        cursor: pointer;
        transition: 0.5s;
      }

      input[type="submit"]:hover {
        box-shadow:
          0 0 10px #D3AF37,
          0 0 60px #D3AF37;
      }

      .group {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }

      .group a {
        color: #fff;
        text-decoration: none;
      }

      .group a:nth-child(2) {
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="login">
        <div class="loginBx">
          <h2>
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
            <i class="fa-solid fa-house"></i>
          </h2>
          <input id="username" type="text" placeholder="Username" />
          <input id="senha" type="password" placeholder="Password" />
          <input id="loginbtn" type="submit" value="Sign in" />
          <div class="group">
            <a href="#">Forgot Password</a>
            <a href="./register.html">Sign up</a>
          </div>
        </div>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
